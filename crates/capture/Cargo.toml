[package]
name = "meeting-capture"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = []
macos-native = ["dep:cpal", "dep:screencapturekit"]

[dependencies]
meeting-domain = { path = "../domain" }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = { version = "0.16", optional = true }
screencapturekit = { version = "0.3.6", optional = true }
