[package]
name = "meeting-storage"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
meeting-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
