[project]
name = "transcribe-whisperx-worker"
version = "0.1.0"
description = "Pinned, isolated WhisperX worker for Meeting Notes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6",
  "torch==2.8.0+cpu",
  "torchaudio==2.8.0+cpu",
  "whisperx==3.7.4",
  "pytest==8.4.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.uv]
package = false
